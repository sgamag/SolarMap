events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /app/src;
        index mapa.html index.html;

        location / {
            try_files /mapa.html =404;
        }
    }
}
