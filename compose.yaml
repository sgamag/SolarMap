services:
  db_config:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: solarmap_db_config
    volumes:
      - .:/app
    working_dir: /app/src
    command: python db_config.py

  descarga:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: solarmap_descarga
    volumes:
      - .:/app
      - /Users/macbook/.cdsapirc:/root/.cdsapirc:ro
    working_dir: /app/src
    command: python descargar_radiacion.py

  limpieza_carga:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: solarmap_limpieza_carga
    volumes:
      - .:/app
    working_dir: /app/src
    command: bash -lc "python procesar_radiacion.py && python db_config.py"

  mapa:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: solarmap_mapa
    volumes:
      - .:/app
    working_dir: /app/src
    command: python ver_db.py
